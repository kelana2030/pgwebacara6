<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet JS - WebGIS</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Leaflet.awesome-markers CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        }

        #map {
            width: 100vw;
            height: calc(100vh - 56px);
            margin-top: 56px;
        }

        /* Styling Leaflet Layer Control & Legenda di Control Layer */
        .leaflet-control-layers {
            border-radius: 10px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15) !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif !important;
            padding: 10px 14px !important;
            background: rgba(255, 255, 255, 0.96) !important;
            backdrop-filter: blur(6px);
            font-size: 12px;
        }

        .leaflet-control-layers-overlays label {
            margin-bottom: 8px;
            font-size: 12px;
        }

        .control-legend-item {
            color: #475569;
            margin-top: 4px;
            margin-left: 20px;
            line-height: 18px;
            font-size: 11px;
        }

        .control-legend-item div {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .control-legend-item i {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 2px;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <!-- Default Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-map-location-dot text-info"></i>
                <span>WebGIS Flores Timur</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Nav items diposisikan di sebelah kanan atas menggunakan ms-auto -->
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com" target="_blank" title="Link">
                            <i class="fa-solid fa-link me-1"></i> Link
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" role="button" data-bs-toggle="modal" data-bs-target="#infoModal" title="About WebGIS">
                            <i class="fa-solid fa-circle-info me-1"></i> About
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Bootstrap Modal About WebGIS -->
    <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fs-6 fw-bold d-flex align-items-center gap-2" id="infoModalLabel">
                        <i class="fa-solid fa-user text-primary"></i> About
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="card bg-light border-0 p-3">
                        <table class="table table-borderless mb-0">
                            <tbody>
                                <tr>
                                    <td class="fw-bold text-secondary ps-0" style="width: 80px;">Nama</td>
                                    <td class="text-secondary" style="width: 10px;">:</td>
                                    <td class="fw-semibold text-dark">yamto adi lestari</td>
                                </tr>
                                <tr>
                                    <td class="fw-bold text-secondary ps-0">NIM</td>
                                    <td class="text-secondary">:</td>
                                    <td class="fw-semibold text-dark">25/567843/SV/27285</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer py-2 bg-light">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet.awesome-markers JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

    <script>

        // =====================================================
        // INISIALISASI PETA
        // =====================================================

        var map = L.map("map").setView(
            [-8.2848467, 123.1649780],
            10
        );


        // =====================================================
        // MAP PANES (Z-INDEX KONTROL LAYER)
        // =====================================================

        // Map Pane untuk Layer Jumlah Penduduk (z-index: 300 - di bawah layer Jalan)
        map.createPane('paneJumlahPenduduk');
        map.getPane('paneJumlahPenduduk').style.zIndex = 300;

        // Map Pane untuk Layer Jalan (z-index: 400 - di atas layer Jumlah Penduduk)
        map.createPane('paneJalan');
        map.getPane('paneJalan').style.zIndex = 400;


        // =====================================================
        // BASEMAP
        // =====================================================

        var basemap = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        );

        basemap.addTo(map);


        // =====================================================
        // FUNGSI SIMBOL AWESOME-MARKERS TOPONIMI
        // =====================================================

        function getAwesomeToponimiIcon(feature) {
            var nama = (feature.properties && feature.properties.TOPONIMI) ? feature.properties.TOPONIMI.toUpperCase() : "";
            var unsur = (feature.properties && feature.properties.NAMA_UNSUR) ? feature.properties.NAMA_UNSUR.toUpperCase() : "";

            if (unsur.includes("GUNUNG") || nama.startsWith("G.") || nama.includes("ILE")) {
                return L.AwesomeMarkers.icon({
                    icon: 'mountain',
                    prefix: 'fa',
                    markerColor: 'red',
                    iconColor: 'white'
                });
            } else if (unsur.includes("TANJUNG") || unsur.includes("TELUK") || nama.startsWith("TG.") || nama.startsWith("TL.")) {
                return L.AwesomeMarkers.icon({
                    icon: 'water',
                    prefix: 'fa',
                    markerColor: 'cadetblue',
                    iconColor: 'white'
                });
            } else {
                return L.AwesomeMarkers.icon({
                    icon: 'location-dot',
                    prefix: 'fa',
                    markerColor: 'orange',
                    iconColor: 'white'
                });
            }
        }


        // =====================================================
        // FUNGSI GAMBAR TOPONIMI
        // =====================================================

        function getGambarToponimi(feature) {

            var nama = "";

            if (
                feature.properties &&
                feature.properties.TOPONIMI
            ) {
                nama =
                    feature.properties.TOPONIMI.toUpperCase();
            }

            if (nama.includes("BOLENG")) {
                return "images/gunung-ile-boleng.jpg";
            }

            if (nama.includes("LEWERO")) {
                return "images/gunung-ile-lewero.jpg";
            }

            if (nama.includes("LEWOTOBI")) {
                return "images/gunung-ile-lewotobi-perempuan.jpg";
            }

            if (nama.includes("MANDIRI")) {
                return "images/gunung-ile-mandiri.jpg";
            }

            return "images/gunung-ile-mandiri.jpg";
        }


        // =====================================================
        // GEOJSON POINT TOPONIMI DENGAN AWESOME MARKERS
        // =====================================================

        var toponimi = L.geoJSON(null, {

            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: getAwesomeToponimiIcon(feature)
                });
            },


            onEachFeature: function (feature, layer) {

                var nama =
                    feature.properties &&
                    feature.properties.TOPONIMI
                        ? feature.properties.TOPONIMI
                        : "Tidak ada nama";


                var coords =
                    feature.geometry.coordinates;


                var imgSrc =
                    getGambarToponimi(feature);


                var popup_content =

                    "<b>Nama:</b> " +
                    nama +

                    "<br>" +

                    "<b>Koordinat:</b> " +
                    coords[1] +
                    ", " +
                    coords[0] +

                    "<br><br>" +

                    "<img src='" +
                    imgSrc +
                    "' " +
                    "alt='" +
                    nama +
                    "' " +
                    "width='200' " +
                    "style='border-radius:6px;'>";


                layer.bindPopup(
                    popup_content
                );


                layer.bindTooltip(
                    nama,
                    {
                        direction: "left",
                        sticky: true
                    }
                );

            }

        });


        // =====================================================
        // LOAD GEOJSON TOPONIMI
        // =====================================================

        $.getJSON(
            "GeoJSON/toponimi.geojson",

            function (data) {

                toponimi.addData(data);

                map.addLayer(toponimi);

            }

        ).fail(function () {

            console.log(
                "File toponimi.geojson tidak ditemukan!"
            );

        });


        // =====================================================
        // GEOJSON LAYER JALAN TERPISAH PER KATEGORI (WARNA PUTIH KONTRAS)
        // =====================================================

        // 1. Jalan Provinsi (Putih, Garis Solid & Tebal)
        var jalan_provinsi = L.geoJSON(null, {
            pane: 'paneJalan',
            style: {
                color: "#ffffff",
                weight: 4.5,
                opacity: 1
            },
            onEachFeature: function (feature, layer) {
                var panjang = (feature.properties && feature.properties.panjang_km) ? feature.properties.panjang_km + " km" : "-";
                layer.bindPopup("<b>Kategori:</b> Jalan Provinsi<br><b>Panjang:</b> " + panjang);
                layer.bindTooltip("Jalan Provinsi", { sticky: true });
            }
        });

        // 2. Jalan Kabupaten (Putih, Garis Terputus-putus)
        var jalan_kabupaten = L.geoJSON(null, {
            pane: 'paneJalan',
            style: {
                color: "#ffffff",
                weight: 3.5,
                dashArray: "8, 6",
                opacity: 1
            },
            onEachFeature: function (feature, layer) {
                var panjang = (feature.properties && feature.properties.panjang_km) ? feature.properties.panjang_km + " km" : "-";
                layer.bindPopup("<b>Kategori:</b> Jalan Kabupaten<br><b>Panjang:</b> " + panjang);
                layer.bindTooltip("Jalan Kabupaten", { sticky: true });
            }
        });

        // 3. Jalan Lain (Putih, Garis Terputus-putus Halus)
        var jalan_lain = L.geoJSON(null, {
            pane: 'paneJalan',
            style: {
                color: "#ffffff",
                weight: 2.5,
                dashArray: "4, 4",
                opacity: 0.95
            },
            onEachFeature: function (feature, layer) {
                var panjang = (feature.properties && feature.properties.panjang_km) ? feature.properties.panjang_km + " km" : "-";
                layer.bindPopup("<b>Kategori:</b> Jalan Lain<br><b>Panjang:</b> " + panjang);
                layer.bindTooltip("Jalan Lain", { sticky: true });
            }
        });


        // =====================================================
        // LOAD GEOJSON JALAN & FILTER PER KATEGORI
        // =====================================================

        $.getJSON(
            "GeoJSON/jalan.geojson",

            function (data) {

                if (data && data.features) {
                    var featProv = {
                        type: "FeatureCollection",
                        features: data.features.filter(function (f) {
                            var u = (f.properties && f.properties.NAMA_UNSUR) ? f.properties.NAMA_UNSUR.toUpperCase() : "";
                            return u.includes("PROPINSI") || u.includes("PROVINSI");
                        })
                    };

                    var featKab = {
                        type: "FeatureCollection",
                        features: data.features.filter(function (f) {
                            var u = (f.properties && f.properties.NAMA_UNSUR) ? f.properties.NAMA_UNSUR.toUpperCase() : "";
                            return u.includes("KABUPATEN");
                        })
                    };

                    var featLain = {
                        type: "FeatureCollection",
                        features: data.features.filter(function (f) {
                            var u = (f.properties && f.properties.NAMA_UNSUR) ? f.properties.NAMA_UNSUR.toUpperCase() : "";
                            return !u.includes("PROPINSI") && !u.includes("PROVINSI") && !u.includes("KABUPATEN");
                        })
                    };

                    jalan_provinsi.addData(featProv);
                    jalan_kabupaten.addData(featKab);
                    jalan_lain.addData(featLain);

                    map.addLayer(jalan_provinsi);
                    map.addLayer(jalan_kabupaten);
                    map.addLayer(jalan_lain);
                }

            }

        ).fail(function () {

            console.log(
                "File jalan.geojson tidak ditemukan!"
            );

        });


        // =====================================================
        // GRADUATED SYMBOLOGY JUMLAH PENDUDUK (3 KELAS COKELAT)
        // DARI MUDA KE TUA
        // =====================================================

        function getColor(penduduk) {

            return penduduk > 25000
                ? "#4a2810" // Cokelat Tua

                : penduduk > 15000
                    ? "#a9714b" // Cokelat Sedang

                    : "#dfc5b3"; // Cokelat Muda

        }


        // =====================================================
        // GEOJSON JUMLAH PENDUDUK
        // =====================================================

        var jumlah_penduduk = L.geoJSON(null, {

            pane: 'paneJumlahPenduduk',

            style: function (feature) {

                var penduduk =
                    Number(
                        feature.properties.Penduduk
                    );


                return {

                    fillColor:
                        getColor(penduduk),

                    color: "#2c1810",

                    weight: 1,

                    fillOpacity: 0.75

                };

            },


            onEachFeature: function (
                feature,
                layer
            ) {

                var penduduk =
                    Number(
                        feature.properties.Penduduk
                    );


                var namaKecamatan =
                    feature.properties.WADMKC ||
                    "Tidak ada nama";


                layer.bindPopup(

                    "<b>" +
                    namaKecamatan +
                    "</b>" +

                    "<br><br>" +

                    "Jumlah Penduduk: " +

                    penduduk.toLocaleString(
                        "id-ID"
                    ) +

                    " jiwa"

                );

            }

        });


        // =====================================================
        // LOAD GEOJSON JUMLAH PENDUDUK
        // =====================================================

        $.getJSON(

            "GeoJSON/jumlah_penduduk.geojson",

            function (data) {

                jumlah_penduduk.addData(data);

                map.addLayer(
                    jumlah_penduduk
                );

                map.fitBounds(
                    jumlah_penduduk.getBounds()
                );

            }

        ).fail(function () {

            console.log(
                "File jumlah_penduduk.geojson tidak ditemukan!"
            );

        });


        // =====================================================
        // LAYER CONTROL DENGAN LEGENDA
        // =====================================================

        var baseMaps = {
            '<span><i class="fa-solid fa-map text-primary" style="margin-right: 6px;"></i><b>OpenStreetMap</b></span>':
                basemap
        };


        var labelPenduduk =
            '<span><b>Jumlah Penduduk</b></span>' +
            '<div class="control-legend-item">' +
            '<div><i style="background:#dfc5b3; border:1px solid #bda290;"></i> 5.117 – 15.000 (Rendah)</div>' +
            '<div><i style="background:#a9714b;"></i> 15.000 – 25.000 (Sedang)</div>' +
            '<div><i style="background:#4a2810;"></i> > 25.000 (Tinggi)</div>' +
            '</div>';

        var overlayMaps = {};
        overlayMaps['<span><i class="fa-solid fa-location-dot text-danger" style="margin-right: 6px; font-size: 14px;"></i><b>Toponimi</b></span>'] = toponimi;
        overlayMaps['<span><span style="display:inline-block; width:18px; height:5px; background:#ffffff; border:1px solid #64748b; margin-right:6px; vertical-align:middle; border-radius:2px;"></span><b>Jalan Provinsi</b></span>'] = jalan_provinsi;
        overlayMaps['<span><span style="display:inline-block; width:18px; height:0; border-top:4px dashed #64748b; margin-right:6px; vertical-align:middle;"></span><b>Jalan Kabupaten</b></span>'] = jalan_kabupaten;
        overlayMaps['<span><span style="display:inline-block; width:18px; height:0; border-top:2.5px dashed #64748b; margin-right:6px; vertical-align:middle;"></span><b>Jalan Lain</b></span>'] = jalan_lain;
        overlayMaps[labelPenduduk] = jumlah_penduduk;


        L.control.layers(
            baseMaps,
            overlayMaps,
            {
                collapsed: false
            }
        ).addTo(map);

    </script>

</body>

</html>
